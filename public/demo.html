<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo customer website</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; color: #111; }
    code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Demo Shop</h1>
  <p>This page pretends to be a customer's website. The chat bubble in the bottom-right corner is your bot.</p>
  <p id="hint"></p>
  <script>
    // Usage: /demo.html?key=YOUR_BOT_PUBLIC_KEY
    var key = new URLSearchParams(location.search).get("key");
    if (!key) {
      document.getElementById("hint").innerHTML = "Add <code>?key=BOT_PUBLIC_KEY</code> to the URL. Copy the full link from the dashboard.";
    } else {
      var s = document.createElement("script");
      s.src = "/widget.js";
      s.setAttribute("data-bot", key);
      s.async = true;
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
